[package]
name = "maia-network-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Maia network service: Wi-Fi through NetworkManager, served over Cap'n Proto"
publish = false

[lib]
name = "maia_network"
path = "src/lib.rs"

[[bin]]
name = "maia-network-service"
path = "src/main.rs"

[dependencies]
capnp = "0.27.2"
capnp-rpc = "0.27.1"
futures = "0.3.34"
tokio = { version = "1.54", features = ["rt", "net", "io-util", "macros", "signal", "time", "sync"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
uuid = { version = "1.26", features = ["v4"] }
libc = "0.2"
serde = "1"
qrcodegen = "1.8"

[build-dependencies]
capnpc = "0.27.0"
