[package]
name = "maia-appearance-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Maia appearance service: window decorations (and later icons, cursors, colors), served over Cap'n Proto"
publish = false

[lib]
name = "maia_appearance"
path = "src/lib.rs"

[[bin]]
name = "maia-appearance-service"
path = "src/main.rs"

[dependencies]
capnp = "0.27.2"
capnp-rpc = "0.27.1"
futures = "0.3.34"
tokio = { version = "1.54", features = ["rt", "net", "io-util", "macros", "signal", "time", "sync", "fs", "process"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Qt plugin metadata (CBOR) of decoration plugins, read without Qt
ciborium = "0.2"

[build-dependencies]
capnpc = "0.27.0"
