[package]
name = "maia-tray-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Maia tray service: the session's system tray (D-Bus StatusNotifierWatcher and host, Cap'n Proto)"
publish = false

[lib]
name = "maia_tray"
path = "src/lib.rs"

[[bin]]
name = "maia-tray-service"
path = "src/main.rs"

[dependencies]
capnp = "0.27.2"
capnp-rpc = "0.27.1"
futures = "0.3.34"
tokio = { version = "1.54", features = ["rt", "net", "io-util", "macros", "signal", "time", "sync", "fs"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
png = "0.18"
serde = "1"
# The flags of RequestName (zbus's default ones replace another owner)
enumflags2 = "0.7"

[build-dependencies]
capnpc = "0.27.0"

[dev-dependencies]
# A paused clock for the tests of timers (images removed after their last use)
tokio = { version = "1.54", features = ["test-util"] }
