# Wayfire in the "Maia (Wayfire)" session.
#
# The session copies this template to ~/.config/maia/<version>/wayfire.ini on its first start
# (with the keyboard layout of the KDE settings, kxkbrc) and uses that copy from then on: change
# it there. It is independent of ~/.config/wayfire.ini, the plain Wayfire session's file.
# Delete the copy to get this template again.
#
# Needed by the session, keep them:
#   [autostart] maia             starts Maia (the session script, phase 2)
#   [autostart] autostart_wf_shell = false   Maia is the shell, not wf-panel/wf-background
#   plugins aurorae              window decorations from KDE Aurorae themes (wayfire-aurorae)
#   plugins plasma-window-management   the window list of Maia's taskbars (maia-windows-service)
# Options not set here have Wayfire's defaults (see /usr/share/wayfire/metadata/*.xml).

[core]
plugins = autostart \
          command \
          move \
          resize \
          place \
          wm-actions \
          switcher \
          fast-switcher \
          grid \
          vswitch \
          expo \
          oswitch \
          zoom \
          animate \
          alpha \
          idle \
          session-lock \
          shortcuts-inhibit \
          gtk-shell \
          xdg-activation \
          foreign-toplevel \
          window-rules \
          aurorae \
          plasma-window-management
# Server-side decorations (aurorae) for every client that accepts them
preferred_decoration_mode = server
xwayland = true
# Wayfire's workspaces (3x3): Ctrl+Super+arrows switch them, Super+E shows them all (expo). Maia's
# taskbars list the windows of every workspace; activating one switches to its workspace.
vwidth = 3
vheight = 3

[autostart]
autostart_wf_shell = false
# $MAIA_SESSION_SCRIPT is set by the session (no install path in this file)
maia = "$MAIA_SESSION_SCRIPT"

[input]
# Filled in from the KDE keyboard settings (kxkbrc) when this file is created
xkb_layout = us
xkb_variant =
xkb_options =

[animate]
# As in a plain Wayfire session. Wayfire's default minimize animation, squeezimize, squeezes the
# window into its taskbar button, which Maia's taskbars do not report yet (set_minimized_geometry);
# without it the window squeezes to the top of the screen.
open_animation = zoom
close_animation = fade
minimize_animation = zoom
duration = 200ms circle
zoom_duration = 500ms circle
fade_duration = 400ms circle

[aurorae]
# An Aurorae theme, always: aurorae can draw only Aurorae themes, and "empty: the theme of kwinrc"
# falls back to an arbitrary one when KWin uses a compiled decoration (Breeze, Oxygen). Se7enAero
# comes with Maia (Lumen's decoration, <prefix>/share/aurorae/themes).
theme = Se7enAero

[plasma-window-management]
allowed_clients = maia-windows-service
check_permissions = true

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = konsole
binding_mute = KEY_MUTE
command_mute = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

[vswitch]
# Ctrl+Super+arrows, as in Windows and GNOME (Wayfire's default is Super+Alt+arrows); with Shift the
# active window goes along
binding_left = <ctrl> <super> KEY_LEFT
binding_right = <ctrl> <super> KEY_RIGHT
binding_up = <ctrl> <super> KEY_UP
binding_down = <ctrl> <super> KEY_DOWN
with_win_left = <ctrl> <shift> <super> KEY_LEFT
with_win_right = <ctrl> <shift> <super> KEY_RIGHT
with_win_up = <ctrl> <shift> <super> KEY_UP
with_win_down = <ctrl> <shift> <super> KEY_DOWN
